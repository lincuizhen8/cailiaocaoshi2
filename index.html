<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻宝材料超市</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #FFF8E7 0%, #FFE4B5 50%, #FFDAB9 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 20px;
            animation: bounceIn 1s ease;
        }

        .header h1 {
            font-size: 42px;
            color: #D35400;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            letter-spacing: 4px;
            position: relative;
            display: inline-block;
        }

        .header h1::before,
        .header h1::after {
            content: "🎁";
            font-size: 36px;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .header h1::before { left: -50px; }
        .header h1::after { right: -50px; }

        .subtitle {
            font-size: 18px;
            color: #E67E22;
            margin-top: 8px;
            font-weight: bold;
        }

        /* 主游戏区域 */
        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 1200px;
            width: 100%;
        }

        /* 货架表格 */
        .shelf-table-wrapper {
            background: #FFF;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 4px solid #F39C12;
            position: relative;
        }

        .shelf-table-wrapper::before {
            content: "🏪";
            font-size: 40px;
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFF;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #F39C12;
        }

        .shelf-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 500px;
            margin-top: 15px;
        }

        .shelf-table th,
        .shelf-table td {
            border: 3px solid #E67E22;
            padding: 12px;
            text-align: center;
            font-size: 18px;
            position: relative;
        }

        .shelf-table th {
            background: linear-gradient(180deg, #F39C12 0%, #E67E22 100%);
            color: #FFF;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .shelf-table th:first-child {
            border-top-left-radius: 15px;
        }

        .shelf-table th:last-child {
            border-top-right-radius: 15px;
        }

        .shelf-table tr:last-child td:first-child {
            border-bottom-left-radius: 15px;
        }

        .shelf-table tr:last-child td:last-child {
            border-bottom-right-radius: 15px;
        }

        .shelf-table td:first-child {
            background: linear-gradient(180deg, #FFF3E0 0%, #FFE0B2 100%);
            font-weight: bold;
            color: #D35400;
            width: 180px;
            font-size: 20px;
        }

        .shelf-table td:last-child {
            background: #FFF8F0;
            min-height: 80px;
            width: 320px;
            vertical-align: top;
        }

        .drop-zone {
            min-height: 70px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            padding: 8px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .drop-zone.drag-over {
            background: #E8F5E9;
            border: 2px dashed #4CAF50;
            transform: scale(1.02);
        }

        .drop-zone.correct {
            background: #C8E6C9;
            border: 2px solid #4CAF50;
        }

        .drop-zone.wrong {
            animation: shake 0.5s ease;
        }

        /* 物品区域 */
        .items-panel {
            background: #FFF;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 4px solid #27AE60;
            min-width: 320px;
            position: relative;
        }

        .items-panel::before {
            content: "🛒";
            font-size: 40px;
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFF;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #27AE60;
        }

        .items-title {
            text-align: center;
            font-size: 22px;
            color: #27AE60;
            font-weight: bold;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .item-card {
            background: linear-gradient(145deg, #FFF 0%, #F5F5F5 100%);
            border: 3px solid #BDC3C7;
            border-radius: 15px;
            padding: 10px 5px;
            text-align: center;
            cursor: grab;
            transition: all 0.3s ease;
            user-select: none;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .item-card:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border-color: #F39C12;
        }

        .item-card:active {
            cursor: grabbing;
        }

        .item-card.dragging {
            opacity: 0.5;
            transform: scale(1.1);
        }

        .item-card.placed {
            opacity: 0.3;
            pointer-events: none;
            border-color: #95A5A6;
        }

        .item-emoji {
            font-size: 36px;
            display: block;
            margin-bottom: 5px;
        }

        .item-name {
            font-size: 14px;
            color: #2C3E50;
            font-weight: bold;
        }

        /* 已放置的物品 */
        .placed-item {
            background: linear-gradient(145deg, #E8F5E9 0%, #C8E6C9 100%);
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 6px 10px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            font-weight: bold;
            color: #2E7D32;
            animation: popIn 0.4s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .placed-item .emoji {
            font-size: 22px;
        }

        /* 按钮区域 */
        .buttons-area {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 2px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::after {
            left: 100%;
        }

        .btn-start {
            background: linear-gradient(135deg, #27AE60 0%, #2ECC71 100%);
            color: #FFF;
        }

        .btn-start:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(39, 174, 96, 0.4);
        }

        .btn-check {
            background: linear-gradient(135deg, #3498DB 0%, #5DADE2 100%);
            color: #FFF;
        }

        .btn-check:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(52, 152, 219, 0.4);
        }

        .btn-exit {
            background: linear-gradient(135deg, #E74C3C 0%, #EC7063 100%);
            color: #FFF;
        }

        .btn-exit:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(231, 76, 60, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 开始遮罩 */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .start-card {
            background: linear-gradient(145deg, #FFF 0%, #FFF8E7 100%);
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 5px solid #F39C12;
            animation: bounceIn 0.8s ease;
        }

        .start-card h2 {
            font-size: 36px;
            color: #D35400;
            margin-bottom: 20px;
        }

        .start-card p {
            font-size: 18px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .start-card .big-emoji {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }

        /* 成功弹窗 */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .success-card {
            background: linear-gradient(145deg, #FFF 0%, #E8F5E9 100%);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 5px solid #27AE60;
            animation: bounceIn 0.6s ease;
        }

        .success-card h2 {
            font-size: 32px;
            color: #27AE60;
            margin-bottom: 15px;
        }

        .success-card .big-emoji {
            font-size: 70px;
            margin-bottom: 15px;
            display: block;
        }

        .success-card p {
            font-size: 18px;
            color: #555;
            margin-bottom: 25px;
        }

        /* 退出确认 */
        .exit-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .exit-card {
            background: #FFF;
            border-radius: 25px;
            padding: 35px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 4px solid #E74C3C;
        }

        .exit-card h3 {
            font-size: 24px;
            color: #E74C3C;
            margin-bottom: 15px;
        }

        .exit-card p {
            font-size: 16px;
            color: #666;
            margin-bottom: 25px;
        }

        .exit-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-confirm {
            background: #E74C3C;
            color: #FFF;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel {
            background: #95A5A6;
            color: #FFF;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-confirm:hover, .btn-cancel:hover {
            transform: scale(1.05);
        }

        /* 提示信息 */
        .hint-bar {
            background: linear-gradient(90deg, #FFF3E0 0%, #FFE0B2 100%);
            border: 2px dashed #F39C12;
            border-radius: 15px;
            padding: 12px 25px;
            margin-bottom: 20px;
            font-size: 16px;
            color: #D35400;
            text-align: center;
            font-weight: bold;
            animation: fadeIn 0.5s ease;
        }

        .hint-bar.hidden {
            display: none;
        }

        /* 动画 */
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes confetti {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            z-index: 999;
            pointer-events: none;
        }

        /* 进度提示 */
        .progress-bar {
            width: 100%;
            max-width: 500px;
            height: 20px;
            background: #E0E0E0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 2px solid #F39C12;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #F39C12 0%, #E67E22 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .progress-text {
            text-align: center;
            font-size: 16px;
            color: #D35400;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* 隐藏的游戏区域 */
        .game-area {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .game-area.active {
            display: flex;
        }
    </style>
<base target="_blank">
</head>
<body>
    <!-- 开始遮罩 -->
    <div class="start-overlay" id="startOverlay">
        <div class="start-card">
            <span class="big-emoji">🎁</span>
            <h2>寻宝材料超市</h2>
            <p>欢迎来到材料超市！<br>请将右侧的物品拖动到对应的货架上。<br>做身体（轻）→ 做配重（重）→ 做装饰（美）→ 做粘贴（牢）<br>全部放对后，点击"检查"按钮！</p>
            <button class="btn btn-start" onclick="startGame()">🚀 开始游戏</button>
        </div>
    </div>

    <!-- 成功弹窗 -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-card">
            <span class="big-emoji">🎉</span>
            <h2>太棒了！</h2>
            <p>你成功将所有材料配对正确！<br>你真是个分类小能手！</p>
            <button class="btn btn-start" onclick="restartGame()">🔄 再玩一次</button>
        </div>
    </div>

    <!-- 退出确认 -->
    <div class="exit-overlay" id="exitOverlay">
        <div class="exit-card">
            <h3>⚠️ 确认退出</h3>
            <p>你确定要退出游戏吗？<br>当前进度将不会保存。</p>
            <div class="exit-buttons">
                <button class="btn-confirm" onclick="confirmExit()">确认退出</button>
                <button class="btn-cancel" onclick="cancelExit()">继续游戏</button>
            </div>
        </div>
    </div>

    <!-- 标题 -->
    <div class="header">
        <h1>寻宝材料超市</h1>
        <div class="subtitle">将材料拖动到正确的货架上吧！</div>
    </div>

    <!-- 游戏区域 -->
    <div class="game-area" id="gameArea">
        <!-- 进度 -->
        <div class="progress-text" id="progressText">已放置：0 / 13</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- 提示 -->
        <div class="hint-bar hidden" id="hintBar">💡 提示：拖动物品到对应的货架上</div>

        <div class="game-container">
            <!-- 货架表格 -->
            <div class="shelf-table-wrapper">
                <table class="shelf-table">
                    <thead>
                        <tr>
                            <th>材料类型</th>
                            <th>推荐材料</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>做身体（轻）</td>
                            <td>
                                <div class="drop-zone" data-category="light" data-accept="乒乓球,蛋壳,矿泉水瓶盖,纸杯"></div>
                            </td>
                        </tr>
                        <tr>
                            <td>做配重（重）</td>
                            <td>
                                <div class="drop-zone" data-category="heavy" data-accept="橡皮泥,大米,螺母"></div>
                            </td>
                        </tr>
                        <tr>
                            <td>做装饰（美）</td>
                            <td>
                                <div class="drop-zone" data-category="beauty" data-accept="彩色纸,画笔,彩色的线"></div>
                            </td>
                        </tr>
                        <tr>
                            <td>做粘贴（牢）</td>
                            <td>
                                <div class="drop-zone" data-category="sticky" data-accept="固体胶,白乳胶,双面胶"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 物品面板 -->
            <div class="items-panel">
                <div class="items-title">🛍️ 材料清单</div>
                <div class="items-grid" id="itemsGrid">
                    <!-- 物品将通过JS生成 -->
                </div>
            </div>
        </div>

        <!-- 按钮 -->
        <div class="buttons-area">
            <button class="btn btn-check" id="checkBtn" onclick="checkAnswers()">✅ 检查</button>
            <button class="btn btn-exit" onclick="showExitConfirm()">🚪 退出</button>
        </div>
    </div>

    <script>
        // 物品数据
        const itemsData = [
            { name: "乒乓球", emoji: "🏓" },
            { name: "彩色纸", emoji: "📄" },
            { name: "固体胶", emoji: "🧴" },
            { name: "蛋壳", emoji: "🥚" },
            { name: "橡皮泥", emoji: "🟤" },
            { name: "画笔", emoji: "🖌️" },
            { name: "白乳胶", emoji: "🧪" },
            { name: "矿泉水瓶盖", emoji: "🧃" },
            { name: "大米", emoji: "🍚" },
            { name: "彩色的线", emoji: "🧶" },
            { name: "双面胶", emoji: "📎" },
            { name: "纸杯", emoji: "🥤" },
            { name: "螺母", emoji: "🔩" }
        ];

        // 正确答案映射
        const correctAnswers = {
            "light": ["乒乓球", "蛋壳", "矿泉水瓶盖", "纸杯"],
            "heavy": ["橡皮泥", "大米", "螺母"],
            "beauty": ["彩色纸", "画笔", "彩色的线"],
            "sticky": ["固体胶", "白乳胶", "双面胶"]
        };

        let draggedItem = null;
        let placedItems = {};
        let totalPlaced = 0;

        // 初始化物品
        function initItems() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            itemsData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.draggable = true;
                card.dataset.name = item.name;
                card.innerHTML = `
                    <span class="item-emoji">${item.emoji}</span>
                    <span class="item-name">${item.name}</span>
                `;

                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);

                // 触摸支持
                card.addEventListener('touchstart', handleTouchStart, {passive: false});
                card.addEventListener('touchmove', handleTouchMove, {passive: false});
                card.addEventListener('touchend', handleTouchEnd, {passive: false});

                grid.appendChild(card);
            });
        }

        // 初始化放置区
        function initDropZones() {
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                zone.addEventListener('dragover', handleDragOver);
                zone.addEventListener('dragleave', handleDragLeave);
                zone.addEventListener('drop', handleDrop);
            });
        }

        // 拖拽开始
        function handleDragStart(e) {
            draggedItem = e.target.closest('.item-card');
            if (draggedItem) {
                draggedItem.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', draggedItem.dataset.name);
            }
        }

        // 拖拽结束
        function handleDragEnd(e) {
            const card = e.target.closest('.item-card');
            if (card) {
                card.classList.remove('dragging');
            }
        }

        // 拖拽经过
        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }

        // 拖拽离开
        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        // 放置
        function handleDrop(e) {
            e.preventDefault();
            const zone = e.currentTarget;
            zone.classList.remove('drag-over');

            const itemName = e.dataTransfer.getData('text/plain');
            if (!itemName) return;

            placeItem(itemName, zone);
        }

        // 触摸支持变量
        let touchItem = null;
        let touchClone = null;
        let touchOffsetX = 0;
        let touchOffsetY = 0;

        function handleTouchStart(e) {
            e.preventDefault();
            touchItem = e.currentTarget.closest('.item-card');
            if (!touchItem || touchItem.classList.contains('placed')) return;

            const touch = e.touches[0];
            const rect = touchItem.getBoundingClientRect();
            touchOffsetX = touch.clientX - rect.left;
            touchOffsetY = touch.clientY - rect.top;

            touchClone = touchItem.cloneNode(true);
            touchClone.style.position = 'fixed';
            touchClone.style.zIndex = '9999';
            touchClone.style.width = rect.width + 'px';
            touchClone.style.height = rect.height + 'px';
            touchClone.style.opacity = '0.8';
            touchClone.style.pointerEvents = 'none';
            touchClone.style.left = (touch.clientX - touchOffsetX) + 'px';
            touchClone.style.top = (touch.clientY - touchOffsetY) + 'px';
            document.body.appendChild(touchClone);

            touchItem.classList.add('dragging');
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!touchClone) return;

            const touch = e.touches[0];
            touchClone.style.left = (touch.clientX - touchOffsetX) + 'px';
            touchClone.style.top = (touch.clientY - touchOffsetY) + 'px';

            // 高亮放置区
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                const rect = zone.getBoundingClientRect();
                if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                    touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                    zone.classList.add('drag-over');
                } else {
                    zone.classList.remove('drag-over');
                }
            });
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            if (!touchClone || !touchItem) return;

            const touch = e.changedTouches[0];
            const zones = document.querySelectorAll('.drop-zone');
            let droppedZone = null;

            zones.forEach(zone => {
                zone.classList.remove('drag-over');
                const rect = zone.getBoundingClientRect();
                if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                    touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                    droppedZone = zone;
                }
            });

            if (droppedZone) {
                placeItem(touchItem.dataset.name, droppedZone);
            }

            touchItem.classList.remove('dragging');
            touchClone.remove();
            touchClone = null;
            touchItem = null;
        }

        // 放置物品到区域
        function placeItem(itemName, zone) {
            // 找到原始物品卡片
            const cards = document.querySelectorAll('.item-card');
            let sourceCard = null;
            cards.forEach(card => {
                if (card.dataset.name === itemName && !card.classList.contains('placed')) {
                    sourceCard = card;
                }
            });

            if (!sourceCard) return;

            // 检查是否已经在其他区域
            const category = zone.dataset.category;
            if (!placedItems[category]) {
                placedItems[category] = [];
            }

            // 如果已经在该区域，不重复添加
            if (placedItems[category].includes(itemName)) return;

            // 从其他区域移除（如果存在）
            for (let cat in placedItems) {
                const idx = placedItems[cat].indexOf(itemName);
                if (idx > -1) {
                    placedItems[cat].splice(idx, 1);
                    // 移除DOM中的显示
                    const otherZone = document.querySelector(`[data-category="${cat}"]`);
                    const placedDivs = otherZone.querySelectorAll('.placed-item');
                    placedDivs.forEach(div => {
                        if (div.textContent.includes(itemName)) {
                            div.remove();
                        }
                    });
                }
            }

            placedItems[category].push(itemName);

            // 创建放置显示
            const itemData = itemsData.find(i => i.name === itemName);
            const placedDiv = document.createElement('div');
            placedDiv.className = 'placed-item';
            placedDiv.dataset.name = itemName;
            placedDiv.innerHTML = `<span class="emoji">${itemData.emoji}</span>${itemName}`;
            zone.appendChild(placedDiv);

            // 标记原卡片为已放置
            sourceCard.classList.add('placed');

            // 更新进度
            updateProgress();

            // 播放音效（视觉反馈）
            zone.style.transform = 'scale(1.02)';
            setTimeout(() => {
                zone.style.transform = 'scale(1)';
            }, 200);
        }

        // 更新进度
        function updateProgress() {
            totalPlaced = 0;
            for (let cat in placedItems) {
                totalPlaced += placedItems[cat].length;
            }

            document.getElementById('progressText').textContent = `已放置：${totalPlaced} / 13`;
            const percent = (totalPlaced / 13) * 100;
            document.getElementById('progressFill').style.width = percent + '%';
        }

        // 检查答案
        function checkAnswers() {
            let allCorrect = true;
            let wrongItems = [];

            const zones = document.querySelectorAll('.drop-zone');

            zones.forEach(zone => {
                const category = zone.dataset.category;
                const correctList = correctAnswers[category];
                const currentItems = placedItems[category] || [];

                // 检查每个放置的物品
                const placedDivs = zone.querySelectorAll('.placed-item');
                placedDivs.forEach(div => {
                    const itemName = div.dataset.name;
                    if (!correctList.includes(itemName)) {
                        allCorrect = false;
                        wrongItems.push({ name: itemName, div: div, zone: zone });
                    }
                });

                // 检查是否缺少物品
                if (currentItems.length < correctList.length) {
                    allCorrect = false;
                }
            });

            if (allCorrect && totalPlaced === 13) {
                // 全部正确
                showSuccess();
            } else {
                // 有错误，让错误物品回到原位
                wrongItems.forEach(item => {
                    item.zone.classList.add('wrong');
                    setTimeout(() => {
                        item.zone.classList.remove('wrong');
                    }, 500);

                    // 移除放置显示
                    item.div.remove();

                    // 从记录中移除
                    const category = item.zone.dataset.category;
                    const idx = placedItems[category].indexOf(item.name);
                    if (idx > -1) {
                        placedItems[category].splice(idx, 1);
                    }

                    // 恢复卡片状态
                    const cards = document.querySelectorAll('.item-card');
                    cards.forEach(card => {
                        if (card.dataset.name === item.name) {
                            card.classList.remove('placed');
                        }
                    });
                });

                updateProgress();

                // 显示提示
                const hintBar = document.getElementById('hintBar');
                hintBar.textContent = '❌ 有些材料放错位置了，它们已经回到原位，请重新拖动！';
                hintBar.classList.remove('hidden');
                setTimeout(() => {
                    hintBar.classList.add('hidden');
                }, 3000);
            }
        }

        // 显示成功
        function showSuccess() {
            const overlay = document.getElementById('successOverlay');
            overlay.style.display = 'flex';
            createConfetti();
        }

        // 创建彩纸效果
        function createConfetti() {
            const colors = ['#F39C12', '#E74C3C', '#27AE60', '#3498DB', '#9B59B6', '#E67E22'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `confetti ${2 + Math.random() * 3}s linear forwards`;
                confetti.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        // 开始游戏
        function startGame() {
            document.getElementById('startOverlay').style.display = 'none';
            document.getElementById('gameArea').classList.add('active');
            document.getElementById('hintBar').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('hintBar').classList.add('hidden');
            }, 4000);
        }

        // 重新开始
        function restartGame() {
            document.getElementById('successOverlay').style.display = 'none';

            // 重置所有状态
            placedItems = {};
            totalPlaced = 0;

            // 清空放置区
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                zone.innerHTML = '';
            });

            // 重置卡片
            const cards = document.querySelectorAll('.item-card');
            cards.forEach(card => {
                card.classList.remove('placed');
            });

            updateProgress();
        }

        // 显示退出确认
        function showExitConfirm() {
            document.getElementById('exitOverlay').style.display = 'flex';
        }

        // 确认退出
        function confirmExit() {
            document.getElementById('exitOverlay').style.display = 'none';
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('startOverlay').style.display = 'flex';
            restartGame();
        }

        // 取消退出
        function cancelExit() {
            document.getElementById('exitOverlay').style.display = 'none';
        }

        // 初始化
        window.onload = function() {
            initItems();
            initDropZones();
        };
    </script>
</body>
</html>
